name: Build and test

# Every push and pull request: unit tests, build the program + Setup.exe,
# then smoke-test the built files (packaging/ci/smoke_test.py). The build
# is uploaded as a workflow artifact you can download from the run page.
# A v* tag additionally publishes a GitHub Release with Setup.exe, the
# portable zip and checksums - the tag must match ocr_reader/version.py.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # winsdk (Windows OCR bindings) has no wheels past Python 3.12.
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -v tests

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build program, read me, Setup.exe and portable zip
        run: python packaging/build.py

      - name: Smoke test the built program and installer
        run: python packaging/ci/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: mk-legacy-access-${{ github.sha }}
          path: |
            dist/MK-Legacy-Kollection-Access-Setup-*.exe
            dist/MK-Legacy-Kollection-Access-Portable-*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MK-Legacy-Kollection-Access-Setup-*.exe
            dist/MK-Legacy-Kollection-Access-Portable-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Screen-reader support for the menus of **Mortal Kombat Legacy Kollection** (Windows, Steam).

            **To install:** download `MK-Legacy-Kollection-Access-Setup-*.exe` and run it. No administrator
            rights needed. Full instructions, hotkeys and troubleshooting are in the
            [read me](https://github.com/Zatoichi420/mk-legacy-kollection-accessibility-mod#readme).

            The installer isn't code-signed, so Windows SmartScreen may say "Windows protected your PC" -
            the read me explains how to continue with the keyboard.
